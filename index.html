<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- no zooming; the game fills the screen -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- opened from the home screen: no Safari bars, black status bar -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Retro Basket">
<meta name="theme-color" content="#0b1433">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}   /* no bounce, no double-tap zoom */
  /* like an app: the page itself never moves; long menus scroll inside the game area */
  html,body{height:100%;overflow:hidden}
  #ui{height:100%;height:100dvh;min-height:0 !important;overflow:hidden;overscroll-behavior:none}
  /* the stats list is the only screen allowed to scroll, and only up and down */
  #ui[data-screen="leaders"]{overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
</style>
<script>
  // No surprise updates: the app never reloads itself. A new version (only when we publish one) shows the
  // next time the app is closed and opened again, because the game loads fresh from the server at launch.
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).catch(() => {}));
</script>
<title>Retro Basket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen:wght@400;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
:root{
  --blue:#2f5fd8; --blue-d:#2149b4; --blue-dd:#17348a; --navy:#0f1f55;
  --white:#ffffff; --yellow:#ffd23f; --yellow-d:#c99a12; --red:#e24b3b; --green:#44c45d; --gray:#4d525e; --gray-d:#383c46;
  --px:"Silkscreen","Courier New",monospace;
  --numf:"Roboto Mono",ui-monospace,Consolas,monospace;
  --body:"Pixelify Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--blue);color:var(--white);height:100%}
body{margin:0;font:15px/1.3 var(--body);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.px{font-family:var(--px)}
#ui{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:10px 16px;min-height:100%}

/* --- chrome --- */
.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-bottom:10px}
.box{border:3px solid var(--white);border-radius:6px;background:var(--blue-dd);padding:4px 10px;font-family:var(--px);font-weight:700;font-size:14px;white-space:nowrap}
.title{font-family:var(--px);font-weight:700;font-size:clamp(18px,3.4vw,28px);text-align:center;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;text-shadow:0 3px 0 var(--navy)}
.title .st{color:var(--yellow);font-size:.7em;vertical-align:.12em;letter-spacing:0}
.btn{font-family:var(--px);font-weight:700;text-transform:uppercase;border:3px solid var(--white);border-radius:6px;background:var(--blue-dd);padding:9px 14px;font-size:14px;letter-spacing:.03em;box-shadow:0 4px 0 var(--navy)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
.btn.go{background:var(--yellow);color:#241a00;border-color:#fff3b8}
.btn.red{background:var(--red)}
.btn.green{background:var(--green);color:#082010}
.btn.sm{padding:5px 9px;font-size:12px;border-width:2px}
.btn:disabled{opacity:.4;pointer-events:none}
.icon{width:40px;height:36px;padding:0;display:grid;place-items:center;font-size:18px}
.panel{border:3px solid var(--white);border-radius:6px;background:var(--blue-d);padding:10px 12px}
.label{font-family:var(--px);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#cfe0ff}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:grid;gap:10px}
.muted{color:#cfe0ff}
.yellow{color:var(--yellow)} .good{color:#7dff95} .bad{color:#ffb3aa}
.debt{color:#ff5e4f !important}                                                  /* cash below zero */
/* numbers use a plain monospace: the pixel fonts' 5 reads as S and 0 as O */
.num,.sal,.card .age{font-family:var(--numf);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:0}
.stars{color:var(--yellow);letter-spacing:1px;text-shadow:1px 1px 0 #6b4a00}
.stars .off{color:#8c93a3;text-shadow:none}

/* --- hub --- */
.hub{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.menu .btn{padding:14px 6px}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.chip{border:3px solid var(--white);border-radius:6px;background:var(--blue-dd);padding:5px 6px;text-align:center}
.chip b{display:block;font-family:var(--px);font-size:14px}
.vs{display:flex;align-items:center;justify-content:space-around;gap:6px;margin:6px 0 10px;text-align:center}
.vs .t{display:grid;justify-items:center;gap:3px}
.vs .n{font-family:var(--px);font-size:12px;text-transform:uppercase}
.badge{width:46px;height:46px;border-radius:6px;display:grid;place-items:center;font-family:var(--px);font-weight:700;font-size:13px;border:3px solid;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.badge.sm{width:28px;height:28px;font-size:9px;border-width:2px}

/* --- cards --- */
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.card{border:3px solid var(--white);border-radius:6px;overflow:hidden;background:var(--gray);padding:0;text-align:center;box-shadow:0 4px 0 var(--navy);position:relative}
.card:active{transform:translateY(2px)}
.card .top{height:62px;position:relative;display:flex;align-items:flex-end;justify-content:center}
.card .top img{width:56px;height:56px;image-rendering:pixelated}
.card .pos{position:absolute;left:4px;top:3px;font-family:var(--px);font-weight:700;font-size:12px;text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.card .age{position:absolute;right:4px;top:4px;font-family:var(--px);font-size:10px;background:rgba(0,0,0,.3);border-radius:3px;padding:1px 3px}
.card .bot{padding:4px 3px 5px;border-top:3px solid var(--white)}
.card .nm{font-family:var(--px);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .fa-x{display:grid;gap:1px;margin-top:4px;font-size:12px;line-height:1.3}
.card .fa-x div{display:flex;justify-content:space-between;gap:4px;white-space:nowrap}
.card .fa-x span{color:#cfe0ff}
.card .fa-x b{color:var(--white);font-size:12px}
.card .fa-x .sh{display:none}                                       /* short labels, for narrow phone cards */
.card .fnm{font-family:var(--px);font-size:9px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sal{font-family:var(--px);font-size:12px}
.card.dim{opacity:.45}
.card .flag{position:absolute;inset:auto 0 0 0;background:var(--red);font-family:var(--px);font-size:10px;padding:2px}
.card:has(.flag) .bot{padding-bottom:22px}                          /* keep the flag from covering the last line */
.pc-PG,.pc-SG{background:#5eb4f0}.pc-SF,.pc-PF{background:#58c98a}.pc-C{background:#e8604f}

.capbar{display:flex;align-items:center;gap:10px;margin-top:10px}
.cap{flex:1;border:3px solid var(--white);border-radius:6px;background:var(--navy);padding:4px 8px}
.cap .t{font-family:var(--px);font-size:11px;text-align:center;margin-bottom:3px}
.cap .track{height:14px;background:#000;border:2px solid #000}
.cap .track i{display:block;height:100%;background:var(--yellow)}

/* --- player page --- */
.pp{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px}
.pp .face{border:3px solid var(--white);border-radius:6px;overflow:hidden;background:var(--gray)}
.pp .face .top{height:120px;display:flex;align-items:flex-end;justify-content:center}
.pp .face img{width:112px;height:112px;image-rendering:pixelated}
.pp .face .bot{padding:6px;border-top:3px solid var(--white);text-align:center}
.rt{display:grid;grid-template-columns:92px minmax(0,1fr) 40px auto;align-items:center;gap:8px;margin-bottom:8px}
.rt .nm{font-family:var(--px);font-size:12px}
.segs{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.segs i{height:14px;background:var(--navy);border-radius:1px}
.segs i.on{background:var(--yellow)}
.segs i.pot{background:#5a6a9a}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--px);font-size:10px;color:#cfe0ff;text-align:right;padding:4px;font-weight:400}
td{padding:5px 4px;text-align:right;border-top:2px solid rgba(255,255,255,.15)}
th:first-child,td:first-child{text-align:left}
tr.me td{color:var(--yellow)}
tr.cut td{border-top:2px dashed var(--yellow)}

.sheet-bg{position:fixed;inset:0;background:rgba(5,10,30,.6);z-index:40}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:41;width:min(460px,calc(100% - 32px));max-height:calc(100% - 24px);overflow:auto;border:3px solid var(--white);border-radius:8px;background:var(--blue-d);padding:14px;box-shadow:0 6px 0 var(--navy)}
.sheet .inner{display:grid;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:60;background:var(--yellow);color:#241a00;font-family:var(--px);font-size:12px;padding:8px 12px;border-radius:4px;border:2px solid #fff;max-width:calc(100% - 32px);text-align:center}
input[type=text]{width:100%;background:var(--navy);border:3px solid var(--white);border-radius:6px;padding:8px;font:16px var(--body);color:#fff}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:4px;border:3px solid transparent;padding:0}
.sw.on{border-color:#fff}

/* --- game --- */
#game{position:fixed;inset:0;background:#0b1433;z-index:30;display:flex;align-items:center;justify-content:center}
#game[hidden]{display:none}
.stage{position:relative}
#court{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.sb{display:flex;align-items:stretch;border:3px solid #fff;border-top:0;border-radius:0 0 10px 10px;background:#0b1433;font-family:var(--px);font-weight:700;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.55)}
.sb .tm{display:flex;align-items:center;gap:8px;padding:4px 10px 5px;min-width:112px;position:relative;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.sb .tm.r{justify-content:flex-end}
.sb .ab{font-size:15px;letter-spacing:.04em;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.sb .sc{font-size:28px;line-height:1;min-width:38px;text-align:center;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.sb .poss{width:8px;height:10px}
.sb .poss.on{background:var(--yellow);clip-path:polygon(0 50%,100% 0,100% 100%)}
.sb .tm.r .poss.on{clip-path:polygon(0 0,100% 50%,0 100%)}
.sb .mid{display:grid;place-items:center;align-content:center;padding:2px 12px;border-inline:3px solid #fff;min-width:78px;background:#0b1433;line-height:1.05}
.sb .q{font-size:11px;color:var(--yellow)}
.sb .clk{font-size:19px;color:#fff}
.shotbox{margin-top:-1px;border:3px solid #fff;border-top:0;border-radius:0 0 6px 6px;background:#1a0d0d;color:#ff5a3c;font-family:var(--px);font-weight:700;font-size:15px;padding:0 10px 2px;min-width:44px;text-align:center;text-shadow:0 0 6px rgba(255,90,60,.6);box-shadow:0 3px 0 rgba(0,0,0,.5)}
.shotbox:empty{display:none}
.gbtn{position:absolute;top:6px;right:6px;pointer-events:auto}
.banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--px);font-weight:700;font-size:26px;text-shadow:0 3px 0 #000,0 0 14px rgba(0,0,0,.6);text-align:center;pointer-events:none;white-space:nowrap}
.banner small.big{font-size:30px;color:#fff;margin-top:6px}
.banner small{display:block;font-size:13px;color:var(--yellow);margin-top:4px}
.meter{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:22px;height:46%;border:3px solid #fff;border-radius:4px;background:#0b1433;pointer-events:none;box-shadow:0 3px 0 #000}
.meter i{position:absolute;left:0;right:0;bottom:0;height:0}
.meter .pct{position:absolute;left:30px;bottom:-4px;font-family:var(--px);font-weight:700;font-size:14px;text-shadow:0 2px 0 #000;white-space:nowrap}
.meter.right{left:auto;right:14px}
.stats[hidden]{display:none}
.stats{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,14,40,.55);z-index:5}
.st-card{border:3px solid #fff;border-radius:8px;background:var(--blue-d);padding:10px 16px 12px;box-shadow:0 5px 0 var(--navy);width:min(430px,92%);display:grid;gap:6px;text-align:center}
.st-title{font-family:var(--px);font-weight:700;font-size:22px;text-shadow:0 3px 0 var(--navy)}
.st-span{font-family:var(--px);font-size:11px;color:var(--yellow);margin-top:-4px}
.st-score{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--px);font-weight:700}
.st-team{border:3px solid #fff;border-radius:5px;padding:2px 8px;font-size:14px}
.st-num{font-size:26px;min-width:40px}
.st-dash{color:#cfe0ff}
.st-table{width:100%;border-collapse:collapse;font-size:15px}
.st-table th{font-family:var(--px);font-size:11px;color:#cfe0ff;text-align:center;font-weight:400;padding:4px 6px;border-top:2px solid rgba(255,255,255,.15)}
.st-table td{padding:4px 6px;border-top:2px solid rgba(255,255,255,.15);font-variant-numeric:tabular-nums;font-family:var(--px);font-size:13px}
.st-table td.u{text-align:left}.st-table td.v{text-align:right}
.st-table .pc{color:#cfe0ff;font-size:11px}
.meter.right .pct{left:auto;right:30px}
.kitp{display:grid;gap:8px;justify-items:center}
.kitp .row{width:100%}
.kitimg{width:112px;height:auto;image-rendering:pixelated;background:#d49a5c;border:3px solid #fff;border-radius:6px;padding:6px 10px}
.kitrow{display:flex;align-items:center;gap:8px;width:100%;justify-content:space-between}
.seg{display:flex;gap:6px}
.lfilt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.lfilt select{font:700 13px var(--px);color:var(--white);background:var(--blue-dd);border:3px solid var(--white);border-radius:6px;padding:6px 8px}
.lt{font-size:13px}.lt td,.lt th{white-space:nowrap}
.lt th button{all:unset;cursor:pointer;padding:2px 3px;border-radius:3px}
.lt th button.on{background:var(--yellow);color:#241a00}
.lt td.nm2{text-align:left;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.lt td.tm{text-align:left;font-family:var(--px);font-size:11px}
.lt td.sorted{color:var(--yellow);font-weight:700}
.lt .zero td{color:#9fb3e0}
.pst{font-size:13px}.pst td,.pst th{white-space:nowrap}.pst td:first-child{font-family:var(--px);font-size:11px;text-align:left}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tpick{display:flex;align-items:center;gap:6px;border:2px solid rgba(255,255,255,.25);border-radius:6px;background:var(--blue-dd);padding:5px 6px;text-align:left}
.tpick.on{border-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow)}
.tpick .tn{font-size:11px;line-height:1.15}.tpick .tn b{font-family:var(--px);font-size:10px}
.shootbtn{position:absolute;right:12px;bottom:12px;width:138px;height:138px;border-radius:50%;font-size:20px;padding:0;touch-action:none;-webkit-touch-callout:none;z-index:4}
.shootbtn:active{transform:translateY(3px)}
.tip{position:absolute;left:50%;transform:translateX(-50%);bottom:4px;font-family:var(--px);font-size:10px;text-align:center;color:#fff;text-shadow:0 2px 0 #000;pointer-events:none;max-width:60%}

/* free agents: tabs by position, one row of cards */
.fatabs{gap:6px;margin-bottom:8px;flex-wrap:wrap}
.cards.farow{grid-template-columns:repeat(var(--n),minmax(0,1fr))}
/* post-game: result | money | fans + continue */
.post3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,.9fr);gap:12px;align-items:start}

/* Edge to edge on notched phones: backgrounds and the court run under the notch; buttons and text stay
   clear of it (env() is 0 on computers, so nothing changes there). The notch is only ~30pt deep. */
#ui{padding-left:max(10px,calc(env(safe-area-inset-left) - 14px));padding-right:max(10px,calc(env(safe-area-inset-right) - 14px))}
.shootbtn{right:calc(12px + env(safe-area-inset-right) * .6);bottom:calc(12px + env(safe-area-inset-bottom) * .5)}
.meter{left:calc(14px + env(safe-area-inset-left) * .7)}.meter.right{right:calc(14px + env(safe-area-inset-right) * .7)}
.gbtn{right:calc(6px + env(safe-area-inset-right) * .6)}

/* Phones sideways (iPhone 14 landscape leaves about 750 x 369 to work with): every screen but the
   stats lists fits on one screen, so spacing, type and art all tighten up. */
@media (max-height:500px){
  #ui{padding-block:6px 8px}                                           /* sides come from the notch-aware rule above */
  .bar{margin-bottom:6px;gap:8px}
  .title{font-size:18px}
  .box{padding:2px 8px;font-size:12px;border-width:2px}
  .icon{width:34px;height:30px;font-size:15px}
  .btn{padding:6px 10px;font-size:12px;box-shadow:0 3px 0 var(--navy)}
  .btn.sm{padding:4px 7px;font-size:11px}
  .panel{padding:6px 9px;border-width:2px}
  .label{font-size:10px}
  .hub{gap:8px}
  .menu{gap:6px}.menu .btn{padding:9px 4px}
  .chips{margin-top:6px;gap:6px}.chip{padding:3px 4px;border-width:2px}
  .vs{margin:2px 0 6px}
  .badge{width:36px;height:36px;font-size:11px}
  /* cards */
  .cards{gap:6px}
  .card{border-width:2px;box-shadow:0 3px 0 var(--navy)}
  .card .top{height:44px}.card .top img{width:40px;height:40px}
  .card .pos{font-size:10px}.card .age{font-size:9px}
  .card .bot{padding:2px 3px 3px;border-top-width:2px}
  .card .nm,.card .sal{font-size:10px}.card .fnm{font-size:8px}
  .card .fa-x,.card .fa-x b{font-size:10px}
  .card .fa-x .lg{display:none}.card .fa-x .sh{display:inline}.card .fa-x b{letter-spacing:-.02em}
  .card .stars{font-size:11px;letter-spacing:0}
  .card:has(.flag) .bot{padding-bottom:16px}.card .flag{font-size:8px;padding:1px}
  .capbar{margin-top:6px;gap:6px}.cap{padding:2px 6px;border-width:2px}.cap .t{font-size:9px;margin-bottom:2px}.cap .track{height:8px}
  .fatabs{margin-bottom:6px}.fanote{display:none}
  /* tables (standings) */
  table{font-size:12px}th{padding:1px 4px;font-size:9px}td{padding:0 4px;border-top-width:1px;line-height:1.2}
  td .stars{font-size:10px;letter-spacing:0}
  /* player page */
  .pp{grid-template-columns:130px minmax(0,1fr);gap:10px}
  .pp .face .top{height:84px}.pp .face img{width:80px;height:80px}
  .pp .face .bot{padding:4px}
  .rt{margin-bottom:4px;grid-template-columns:78px minmax(0,1fr) 36px auto;gap:6px}
  .rt .nm{font-size:10px}.segs i{height:10px}
  .rt + .muted{display:none}                                           /* rating descriptions */
  .pst{font-size:11px}.pst td,.pst th{padding:1px 4px}
  .pp .panel .muted{display:none}                                      /* "per game" footnote under the stats table */
  .rt{margin-bottom:2px}
  /* team picker */
  .tgrid{gap:4px}.tpick{padding:2px 4px;gap:4px}.tpick .tn{font-size:9px;line-height:1.05}.tpick .tn b{font-size:8px}
  .badge.sm{width:22px;height:22px;font-size:7px}
  /* uniforms */
  .kitimg{width:78px;padding:3px 6px}.kitp{gap:4px}
  /* post-game */
  .post3{gap:8px}.post3 .panel{font-size:12px !important}
  .post3 .px.num{font-size:22px !important}
  .sheet{padding:10px}.sheet .inner{gap:6px}
}

#rotate{display:none;position:fixed;inset:0;z-index:100;background:var(--blue);align-items:center;justify-content:center;text-align:center;padding:24px}
#rotate .in{display:grid;gap:14px;justify-items:center}
@media (orientation:portrait) and (max-width:700px){ #rotate{display:flex} }

// Meter: fill = (2t)^2.41 up to 0.50s (so 0.375s is 50%), then mirrors back down to 0 at 1.00s.
const METER_K = Math.log(.5) / Math.log(.75);

const releaseF = m => m >= .85 ? .92 + (Math.min(m, 1) - .85) / .15 * .08 : m <= .4 ? 0 : .92 * Math.pow((m - .4) / .45, 2);

let lastPoss = null;                                                             // what the last simPossession did, for the box score
function simPossession(off, def, meter){
  const P = lastPoss = { to:false, shots:[] };
  if (Math.random() < .09 + (5 - off.hnd) * .012) { P.to = true; return 0; }        // turnover
  let pts = 0, tries = 0;
  while (tries++ < 3) {
    const r = Math.random(), d = r < .34 ? rnd(23.8, 26) : r < .68 ? rnd(9, 20) : rnd(2, 6);
    const contested = Math.random() < clamp(.35 + (def.spd - off.spd) * .07, .1, .75);
    const made = Math.random() < shotChance(meter, d, off.sht, contested);
    P.shots.push({ three:d > 23.75, made });
    if (made) { pts = d > 23.75 ? 3 : 2; break; }
    if (Math.random() > .24 + (off.sta - def.sta) * .015) break;                 // defensive rebound
  }
  return pts;
}
const teamPlayers = t => t.user ? rosterArr() : (t.players || []);
const wPick = (arr, w) => { let x = Math.random() * arr.reduce((s, p) => s + w(p), 0); for (const p of arr) { x -= w(p); if (x <= 0) return p; } return arr[0]; };

// hand out the last possession to players: sides are { pl, box (points), pb (other stats) }; def may be null
function creditPoss(off, def){
  const P = lastPoss; if (!P || !off.pl.length) return;
  const passes = ri(0, 3);
  for (let i = 0; i < passes; i++) pbFor(off.pb, wPick(off.pl, p => .5 + p.hnd)).pass++;
  if (P.to) { pbFor(off.pb, wPick(off.pl, p => 11 - p.hnd)).to++; return; }
  P.shots.forEach((s, i) => {
    const p = wPick(off.pl, p => .5 + p.sht + (s.three ? p.sht * .5 : 0)), b = pbFor(off.pb, p);
    b.fga++; if (s.three) b.tpa++;
    if (s.made) { b.fgm++; if (s.three) b.tpm++; off.box[p.id] = (off.box[p.id] || 0) + (s.three ? 3 : 2); return; }
    const offReb = i < P.shots.length - 1, side = offReb ? off : def;
    if (side && side.pl.length) pbFor(side.pb, wPick(side.pl, p => REB_W[p.pos])).reb++;
  });
}
// add one game's box score to each player's season and career lines
function addStats(players, box, pb){
  for (const p of players) {
    p.s ||= {}; p.c ||= {};
    for (const o of [p.s, p.c]) {
      o.gp = (o.gp || 0) + 1; o.pts = (o.pts || 0) + (box[p.id] || 0);
      const b = pb[p.id]; if (b) for (const k in b) o[k] = (o[k] || 0) + b[k];
    }
  }
}
// the other team in a game you played live: build a believable box score that adds up to their final score
function fakeBox(players, score){
  const box = {}, pb = {};
  let left = score;
  while (left >= 2) {
    const three = left === 3 || (left >= 5 && Math.random() < .34);
    const p = wPick(players, p => .5 + p.sht), b = pbFor(pb, p);
    while (Math.random() > .5) { b.fga++; if (Math.random() < .35) b.tpa++; pbFor(pb, wPick(players, p => REB_W[p.pos])).reb += Math.random() < .25 ? 1 : 0; }
    b.fga++; b.fgm++; if (three) { b.tpa++; b.tpm++; }
    box[p.id] = (box[p.id] || 0) + (three ? 3 : 2); left -= three ? 3 : 2;
    for (let i = ri(0, 2); i > 0; i--) pbFor(pb, wPick(players, p => .5 + p.hnd)).pass++;

  for (let i = ri(4, 9); i > 0; i--) pbFor(pb, wPick(players, p => 11 - p.hnd)).to++;

function simScore(h, a, hMeter = .86, aMeter = .86, hBox = null, hPb = null, aBox = null, aPb = null){

  const go = (o, d, O, D, m) => { const pts = simPossession(O, D, m); creditPoss(o, d); return pts; };

  while (hs === as) { hs += go(hS, aS, H, A, hMeter); as += go(aS, hS, A, H, aMeter); }

const TICKET_MIN = 100, TICKET_MAX = 800, TICKET_FAIR = 150, FOOD_PER_FAN = 18, FANS_PER_CAR = 2.5, PARKING = 40;
const attendance = () => clamp(.3 + G.fans / 100 * .7 - (G.ticket - TICKET_FAIR) / 700, .05, 1);
function homeGate(){
  const att = attendance(), crowd = Math.round(seats(G.fac.arena) * att);
  const tickets = crowd * G.ticket / 1e6, food = crowd * FOOD_PER_FAN / 1e6, parking = Math.round(crowd / FANS_PER_CAR) * PARKING / 1e6;
  return { att, crowd, tickets, food, parking, total:tickets + food + parking };
}
// salary cap: $20M to start, +$10M per 25 credits, up to $70M
const CAP_START = 20, CAP_MAX = 70, CAP_STEP = 10, CAP_COST = 25;
const capNow = () => G.cap || CAP_START;
// training a stat: 2 CR for the first point you add, +1 CR for each point after that (p.tr counts points trained per stat)
const trainCost = (p, k) => 2 + ((p.tr || {})[k] || 0);
// credits per game: 2 under 20% fans, then +1 for every 20% (20-40% is 3, ... 80-100% is 6)
const gameCredits = () => 2 + Math.floor(Math.min(G.fans, 99.9) / 20);
// every game each player is paid 1/17 of his yearly salary (14 regular-season games + up to 3 playoff games)
const PAY_GAMES = 17;
const perGame = p => p.sal / PAY_GAMES;
// to sign someone you need the cash to pay him for the rest of this season
// free agents want a signing bonus in cash up front: $250K at 1 star up to $2.5M at 5 stars, to the nearest $50K
const signBonus = p => Math.round((.25 + (clamp(starsSmooth(p), 1, 5) - 1) * .5625) * 20) / 20;
const FAN_WIN = 3, FAN_LOSS = -5, FAN_NEW = 1, NEW_GAMES = 3, FAN_MIN = 15;
function pbFor(pbox, p){ return pbox[p.id] ||= { fgm:0, fga:0, tpm:0, tpa:0, reb:0, pass:0, to:0 }; }
// credit one simulated possession to our players: makes to a scorer, misses to a shooter plus a possible rebound
function simCredit(box, pbox){ creditPoss({ pl:rosterArr(), box, pb:pbox }, null); }
function applyResult(M, us, them, box, pbox = {}){
  const win = us > them, t = userTeam();
  if (M.kind === 'regular') M.home ? record(t, M.opp, us, them) : record(M.opp, t, them, us);
  const H = M.home ? homeGate() : { att:0, crowd:0, tickets:0, food:0, parking:0, total:0 };   // before fans change
  const att = H.att, gate = H.tickets;
  G.cash += H.total + TV; G.fin.gate += gate; G.fin.tv += TV;
  G.fin.food = (G.fin.food || 0) + H.food; G.fin.parking = (G.fin.parking || 0) + H.parking;
  const cr = gameCredits();                                         // by fans going into the game
  G.credits += cr;
  const pay = rosterArr().map(p => ({ name:`${p.fn[0]}. ${p.ln}`, pos:p.pos, amt:perGame(p) }));
  const salaries = pay.reduce((s, x) => s + x.amt, 0);
  G.cash -= salaries; G.fin.salaries = (G.fin.salaries || 0) + salaries;
  G.gpSeason = (G.gpSeason || 0) + 1;
  // fans: the result, plus 1% for each newly signed player's first 3 games
  const newBoost = (G.boosts || []).length * FAN_NEW;
  G.boosts = (G.boosts || []).map(n => n - 1).filter(n => n > 0);
  const fanResult = win ? FAN_WIN : FAN_LOSS;
  const fansBefore = G.fans;
  G.fans = clamp(G.fans + fanResult + newBoost, FAN_MIN, 100);
  for (const p of rosterArr()) { p.gp++; p.pts += box[p.id] || 0; }
  addStats(rosterArr(), box, pbox);                                 // this season, and career
  const top = Object.entries(box).map(([id, pts]) => [rosterArr().find(p => p.id === id), pts]).filter(x => x[0]).sort((a, b) => b[1] - a[1]).slice(0, 3);
  G.last = { opp:M.opp.id, home:M.home, us, them, win, gate, tv:TV, cr, pay, salaries, fanResult, newBoost, fansBefore, fans:G.fans, cash:G.cash, att, crowd:H.crowd, food:H.food, parking:H.parking, kind:M.kind, top:top.map(([p, pts]) => ({ name:`${p.fn[0]}. ${p.ln}`, pos:p.pos, pts })) };
}
function userPlaysThisWeek(){ return G.schedule[G.week]?.some(g => g.h === 'U' || g.a === 'U'); }
function skipByes(){ while (G.phase === 'regular' && G.week < G.schedule.length && !userPlaysThisWeek()) finishWeek(); }
function finishWeek(){
  for (const g of G.schedule[G.week]) {
    if (g.h === 'U' || g.a === 'U') continue;
    const h = teamById(g.h), a = teamById(g.a), [hs, as] = simScore(h, a);
    record(h, a, hs, as);
  }
  G.week++;
  if (G.week >= G.schedule.length) startPlayoffs();

/* ============================ playoffs + offseason ============================ */
function startPlayoffs(){
  const E = confStandings('E').slice(0, 4).map(t => t.id), W = confStandings('W').slice(0, 4).map(t => t.id);
  G.phase = 'playoffs';
  G.playoffs = { round:0, seeds:[...E, ...W], games:[[E[0], E[3]], [E[1], E[2]], [W[0], W[3]], [W[1], W[2]]], champ:null, reached:-1, userOut:false };
  G.playoffs.userOut = !G.playoffs.seeds.includes('U');
}
function nextPlayoffGame(){
  const P = G.playoffs;
  if (P.round > 2 || P.userOut) return null;
  return P.games.find(m => m.includes('U')) || null;
}
// play out the current round (our game uses userWinner), then set up the next one
function playoffRound(userWinner){
  const P = G.playoffs;
  const sim = (h, a) => { const [hs, as] = simScore(teamById(h), teamById(a)); return hs > as ? h : a; };
  const winners = P.games.map(([h, a]) => (userWinner && (h === 'U' || a === 'U')) ? userWinner : sim(h, a));
  if (P.games.some(m => m.includes('U'))) { P.reached = P.round; if (!winners.includes('U')) P.userOut = true; }
  if (P.round === 2) {
    P.champ = winners[0]; P.round = 3;
    if (P.reached === 2) {
      if (P.champ === 'U') { G.cash += 3; G.fin.bonus += 3; G.credits += 10; }
      else { G.cash += 1; G.fin.bonus += 1; }
    }
    startOffseason(); return;
  }
  P.games = P.round === 0 ? [[winners[0], winners[1]], [winners[2], winners[3]]] : [[winners[0], winners[1]]];
  P.round++;
}
function resolvePlayoffs(userWinner){
  if (userWinner) { playoffRound(userWinner); return; }
  while (G.phase === 'playoffs') playoffRound(null);
}
function finishText(){
  const P = G.playoffs;
  if (P.champ === 'U') return 'Champions';
  if (P.reached === 2) return 'Lost in the Finals';
  if (P.reached === 1) return 'Lost in the conference final';
  if (P.reached === 0) return 'Lost in the conference semis';
  return 'Missed the playoffs';
}
function grow(p, steps){
  let guard = 0;
  while (steps !== 0 && guard++ < 60) {
    const k = pick(RATE), s = Math.sign(steps);
    if (s > 0 && (p[k] >= 10 || pAvg(p) + .25 > p.pot)) { if (pAvg(p) + .25 > p.pot) break; continue; }
    if (s < 0 && p[k] <= 1) continue;
    p[k] += s; steps -= s;
  }
}
function startOffseason(){
  const t = userTeam(), finish = finishText();
  const champ = teamById(G.playoffs.champ);
  G.history.unshift({ season:G.season, w:t.w, l:t.l, finish, champ:`${champ.city} ${champ.name}` });
  const changes = [], retired = [];
  const tf = 1 + .25 * (G.fac.training - 1);
  for (const pos of POS) {
    const p = G.roster[pos]; if (!p) continue;
    const before = pStars(p);
    let s = p.age <= 21 ? ri(2, 4) : p.age <= 24 ? ri(1, 3) : p.age <= 28 ? ri(0, 1) : p.age <= 31 ? ri(-2, 0) : ri(-3, -1);
    if (s > 0) s = Math.round(s * tf);
    grow(p, s); p.age++; p.gp = p.pts = p.fga = p.fgm = 0; p.s = {};
    if (p.age >= 34 && Math.random() < (p.age - 33) * .3) { retired.push(`${p.fn} ${p.ln} (${pos}, age ${p.age})`); G.roster[pos] = null; continue; }
    if (pStars(p) !== before) changes.push({ name:`${p.fn} ${p.ln}`, pos, from:before, to:pStars(p) });
    p.yrs--;
  }
  for (const tm of G.league) if (!tm.user) tm.players = tm.players.map(p => {
    grow(p, p.age <= 22 ? ri(1, 3) : p.age <= 26 ? ri(0, 2) : p.age <= 30 ? ri(-1, 1) : p.age <= 33 ? ri(-2, 0) : ri(-3, -1)); p.age++;
    if (p.age >= 38 && Math.random() < .5) { const r = makePlayer(p.pos, rnd(4, 6.5), ri(22, 27)); r.sal = askSalary(r); r.yrs = 2; return r; }
    return p;
  });
  const order = standings().reverse().map(x => x.id);
  const prospects = [];
  POS.forEach(pos => { for (let i = 0; i < 2; i++) { const p = makePlayer(pos, rnd(2.5, 5.5), ri(19, 22)); p.pot = Math.min(10, Math.round((pAvg(p) + rnd(1.5, 4.5)) * 2) / 2); p.sal = Math.max(1, Math.round(askSalary(p)) / 2); p.yrs = 3; p.scout = RATE.reduce((o, k) => (o[k] = clamp(p[k] + ri(-1, 1) * Math.max(0, 3 - G.fac.scouting + 1) , 1, 10), o), {}); prospects.push(p); } });
  G.phase = 'offseason';
  G.off = { step:'summary', finish, champ:`${champ.city} ${champ.name}`, record:`${t.w}-${t.l}`, changes, retired, order, prospects, picks:2, round:1, fin:{ ...G.fin } };
  save();
}
function startNewSeason(){
  for (const pos of POS) if (!G.roster[pos]) { const p = makePlayer(pos, rnd(2, 3), ri(22, 30)); p.sal = 1; p.yrs = 1; G.roster[pos] = p; }
  G.season++; G.week = 0; G.phase = 'regular'; G.playoffs = null; G.off = null; G.last = null; G.results = [];
  for (const t of G.league) t.w = t.l = t.pf = t.pa = 0;
  for (const p of [...G.league.flatMap(t => t.players || []), ...rosterArr(), ...G.fa, ...(G.pool || [])]) p.s = {};

  G.fin = { gate:0, tv:0, bonus:0, spend:0, salaries:0 }; G.gpSeason = 0;

/* ============================ portraits ============================ */
const portraitCache = {};
function portrait(p, c1){
  const key = [p.id, c1, p.style, p.skin, p.hair, p.band, p.face].join('|');
  if (portraitCache[key]) return portraitCache[key];
  const S = 20, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const c = cv.getContext('2d'), f = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h); };
  const O = '#1a1426', sh = shade(p.skin, -.16), hi = shade(p.skin, .12), H = p.hair;
  const st = p.style === 'headband' ? 'bald' : p.style, band = p.band || p.style === 'headband', face = p.face || '';
  f(2, 15, 16, 5, O); f(3, 16, 14, 4, c1); f(8, 16, 4, 1, '#ffffff');        // shoulders + jersey
  f(8, 13, 4, 3, O); f(9, 13, 2, 3, p.skin);                                // neck
  if (st === 'long') { f(4, 2, 12, 11, O); f(5, 3, 10, 9, H); }             // hair behind the head, down past the ears
  f(5, 3, 10, 11, O); f(6, 4, 8, 9, p.skin); f(5, 7, 1, 3, p.skin); f(14, 7, 1, 3, p.skin);
  if (st === 'bald') f(8, 4, 3, 1, hi);                                      // shine
  if (st === 'buzz') { f(6, 4, 8, 1, H); f(6, 5, 1, 1, H); f(13, 5, 1, 1, H); }
  if (st === 'fade') { f(6, 3, 8, 2, H); f(6, 5, 1, 2, sh); f(13, 5, 1, 2, sh); }
  if (st === 'afro') { f(4, 1, 12, 5, O); f(5, 1, 10, 5, H); f(4, 5, 2, 3, H); f(14, 5, 2, 3, H); }
  if (st === 'curly') { f(5, 2, 10, 4, O); f(6, 2, 8, 3, H); [6, 8, 10, 12].forEach(x => f(x, 1, 1, 1, H)); f(5, 5, 1, 2, H); f(14, 5, 1, 2, H); }
  if (st === 'long') { f(5, 2, 10, 3, O); f(6, 2, 8, 3, H); f(6, 5, 3, 1, H); f(5, 4, 1, 8, H); f(14, 4, 1, 8, H); }
  if (st === 'cornrows') { f(5, 2, 10, 3, O); f(6, 3, 8, 2, H); [7, 9, 11].forEach(x => f(x, 3, 1, 2, sh)); f(6, 5, 1, 1, H); f(13, 5, 1, 1, H); }
  if (st === 'hitop') { f(5, 0, 10, 5, O); f(6, 0, 8, 5, H); f(6, 5, 1, 1, sh); f(13, 5, 1, 1, sh); }
  if (band) { f(5, 5, 10, 1, O); f(6, 5, 8, 1, '#ffffff'); }
  f(7, 8, 2, 1, '#ffffff'); f(11, 8, 2, 1, '#ffffff'); f(8, 8, 1, 1, O); f(12, 8, 1, 1, O);
  f(7, 7, 2, 1, O); f(11, 7, 2, 1, O);
  if (face.includes('unibrow')) f(9, 7, 2, 1, O);
  f(9, 10, 2, 1, 'rgba(0,0,0,.25)');
  if (face.includes('beard')) { f(6, 9, 1, 3, H); f(13, 9, 1, 3, H); f(6, 11, 8, 2, H); f(7, 12, 6, 1, H); }
  if (face.includes('goatee')) { f(8, 12, 4, 1, H); f(8, 10, 4, 1, H); }
  if (face.includes('stache')) f(8, 10, 4, 1, H);
  f(8, 11, 4, 1, '#8a3b2e');                                                 // mouth, on top of any beard
  if (face.includes('goggles')) { f(5, 7, 10, 1, O); f(6, 7, 3, 2, O); f(11, 7, 3, 2, O); f(7, 7, 2, 1, '#bfe3ff'); f(11, 7, 2, 1, '#bfe3ff'); f(7, 8, 1, 1, '#bfe3ff'); f(12, 8, 1, 1, '#bfe3ff'); }
  return portraitCache[key] = cv.toDataURL();
}

/* ---- sheets / toast ---- */
let closeFn = null;
function openSheet(html, mount){
  closeSheet();
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.setAttribute('role', 'dialog');
  sh.innerHTML = `<div class="inner">${html}</div>`;
  document.body.append(bg, sh);
  closeFn = () => { bg.remove(); sh.remove(); closeFn = null; };
  bg.onclick = closeSheet; mount?.(sh);
}
function closeSheet(){ closeFn?.(); }
let toastT;
function toast(m){ document.querySelector('.toast')?.remove(); clearTimeout(toastT); const e = document.createElement('div'); e.className = 'toast'; e.textContent = m; document.body.append(e); toastT = setTimeout(() => e.remove(), 2600); }

function compareSheet(p, verb, onYes, shown, extra = ''){
  const cur = G.roster[p.pos];
  const show = shown || p;
  const rows = RATE.map(k => `<div class="row between" style="font-size:14px"><span>${RATE_NAME[k]}</span><span class="num">${cur ? `${cur[k]} → ` : ''}<b class="${cur && show[k] > cur[k] ? 'good' : cur && show[k] < cur[k] ? 'bad' : ''}">${show[k]}</b></span></div>`).join('');
  openSheet(`<div class="row"><img src="${portrait(p, userTeam().c1)}" style="width:64px;height:64px;image-rendering:pixelated;border:3px solid #fff;border-radius:6px" class="${posColor(p.pos)}" alt="">
      <div><div class="px">${p.pos} ${esc(p.fn)} ${esc(p.ln)}</div>${starsHTML(pStars(show))}<div class="muted" style="font-size:13px">Age ${p.age} · Max ${potStars(p)}★ · ${money(p.sal)} × ${p.yrs}yr</div></div></div>
    ${rows}
    ${extra}
    ${cur ? `<div class="muted" style="font-size:13px">He replaces ${esc(cur.fn)} ${esc(cur.ln)}, who leaves the team.</div>` : ''}
    <div class="row"><button class="btn go grow" id="yes">${verb}</button><button class="btn" id="no">Cancel</button></div>`, sh => {
    sh.querySelector('#no').onclick = closeSheet;
    sh.querySelector('#yes').onclick = () => { closeSheet(); onYes(); };
  });
}
function replaceAt(p){
  const cur = G.roster[p.pos];
  if (cur) { cur.sal = askSalary(cur); cur.yrs = askYears(cur); if (cur.age < 34) G.fa.push(cur); }
  p.gp = p.pts = p.fga = p.fgm = 0; p.s = {};
  G.roster[p.pos] = p; uniqueNum(p);
}

  if (kt) { const [who, part, v] = kt.dataset.kit.split('|'); kitSel[who][part] = v; render(); return; }

function holderEnt(){ const h = M.ball.holder; return h ? (h.side === 'us' ? M.our[h.i] : M.th[h.i]) : null; }
function give(side, i){ M.ball.holder = { side, i }; M.ball.fl = null; if (side === 'us') M.handler = i; }

function startOurs(fromX, fromY, inbound){

function startTheirs(fromX, fromY, inbound){

function nearestIdx(arr, pt){ let b = 0, bd = 1e9; arr.forEach((e, i) => { const d = dist(e, pt); if (d < bd) { bd = d; b = i; } }); return b; }

function simRest(){
  if (!M) return;
  const U = userRatings(), O = teamR(M.opp);
  const quartersLeft = (M.q <= 4 ? 4 - M.q : 0) + M.clock / 900;
  const n = Math.round(7 * quartersLeft);
  for (let i = 0; i < n; i++) {
    const pts = simPossession(U, O, .84); simCredit(M.box, M.pbox, pts); M.us += pts;
    M.them += simPossession(O, U, .86);

/* ---- movement ---- */
function moveTo(e, tx, ty, sp, dt){

  if (d < .3) { e.moving = false; return true; }
  const s = Math.min(d, sp * dt); e.x += dx / d * s; e.y += dy / d * s;
  if (Math.abs(dx) > .2) e.face = dx > 0 ? 1 : -1;
  e.moving = true; e.anim += dt * 16;                                // 8 frames, about 2 strides a second
  return d - s < .3;
}
// speed gap kept small: a 10-speed player is only about 35% quicker than a 2-speed one
const ourSpeed = e => (9 + e.p.spd * .45) * (1 - (e.fat || 0));
const oppSpeed = e => (9 + e.p.spd * .45) * (1 - (e.fat || 0));
const BALL_SLOW = .9;                                                 // whoever has the ball moves 10% slower
// Stamina, both teams: over each quarter a player loses 15% speed at 1/10 stamina down to 5% at 10/10,
// steadily with the game clock. Each break gives 5% back, so tiredness builds through the game.
// (Your Conditioning upgrade trims your players' loss by 10% a level.)
const quarterLoss = (e, ours) => (15 - (clamp(e.p.sta, 1, 10) - 1) * 10 / 9) / 100 * (ours ? 1 - .1 * (G.fac.conditioning - 1) : 1);
function tireAll(){
  const len = M.q > 4 ? 300 : 900, done = 1 - clamp(M.clock / len, 0, 1);
  M.our.forEach(e => e.fat = (e.fat0 || 0) + quarterLoss(e, true) * done);
  M.th.forEach(e => e.fat = (e.fat0 || 0) + quarterLoss(e, false) * done);
}
function tire(){}                                                     // speed now follows the clock (tireAll), not steps taken
const isOpen = i => { const e = M.our[i], d = M.th[i]; return !(Math.hypot(e.x - d.x, e.y - d.y) < 3.5 && (d.still || 0) > .15); };

function update(dt){
  if (!M || paused) return;
  M.flash = Math.max(0, M.flash - dt);
  for (const e of [...M.our, ...M.th]) if (e.shootT > 0) e.shootT -= dt;
  tireAll();
  const running = ['back', 'live', 'opp', 'shot', 'oshot', 'pass', 'opass', 'reb'].includes(M.phase);
  if (running && M.phase !== 'reb') M.st[['opp', 'opass', 'oshot'].includes(M.phase) ? 'them' : 'us'].poss += dt * G.speed;
  if (running) { M.clock -= dt * G.speed; if (M.phase === 'back' || M.phase === 'live' || M.phase === 'pass' || M.phase === 'shot') M.shot -= dt * 2; }
  if (M.phase === 'back') updateBack(dt);
  else if (M.phase === 'live' || M.phase === 'pass') updateLive(dt);
  else if (M.phase === 'opp' || M.phase === 'opass') updateOpp(dt);
  else if (M.phase === 'shot') updateCrash(dt);
  else if (M.phase === 'oshot') { updateOpp(dt); if (M.oshot) updateOppMeter(); }
  else if (M.phase === 'reb') updateReb(dt);
  updateBall(dt);
  if ((M.phase === 'live' || M.phase === 'back') && M.shot <= 0) { turnover('SHOT CLOCK'); }
  else if ((M.phase === 'live' || M.phase === 'back') && M.clock <= 0) { M.phase = 'break'; endQuarter(); }
  if (M && M.shooting && !M.shooting.released) {
    const t = (performance.now() - M.shooting.t0) / 1000;
    showMeter(meterFill(t));
    if (t >= METER_PEAK * 2) release(true);
  }
  if (M) hud();
}
function guardOurs(dt){
  // their defenders chase our men with a delay that grows with our speed
  M.th.forEach((d, i) => {
    const man = M.our[i];
    d.lagT -= dt;
    // slower to react: they only re-read where their man is every half second or so (longer against fast players)
    if (d.lagT <= 0) { d.lagT = .45 + man.p.spd * .06; d.lx = man.x; d.ly = man.y; }
    const vx = RIM_R.x - d.lx, vy = RIM_R.y - d.ly, l = Math.hypot(vx, vy) || 1;
    const gap = i === M.handler ? 2.8 + man.p.spd * .1 : 2.8;
    moveTo(d, d.lx + vx / l * gap, d.ly + vy / l * gap, oppSpeed(d) * .92, dt);
    d.still = d.moving ? 0 : (d.still || 0) + dt;
    d.face = 1 * -1;
  });
}
// our shot is in the air: our two teammates nearest the rim (not the shooter) crash the glass,
// one each side of the rim; their men trail them a step slower. Everyone else watches.
function updateCrash(dt){
  const F = M.ball.fl, shooter = F && F.shooter;
  if (!M.crash) M.crash = M.our.map((e, i) => ({ i, d:dist(e, RIM_R) })).filter(o => M.our[o.i] !== shooter).sort((a, b) => a.d - b.d).slice(0, 2).map(o => o.i);
  M.our.forEach((e, i) => {
    const k = M.crash.indexOf(i);
    if (k < 0) { e.moving = false; return; }
    moveTo(e, RIM_R.x - 5, RIM_R.y + (k ? 4.5 : -4.5), ourSpeed(e), dt); tire(e, dt);
  });
  M.th.forEach((d, i) => {
    if (!M.crash.includes(i)) { d.moving = false; return; }
    const man = M.our[i];
    moveTo(d, man.x - 1.2, man.y, oppSpeed(d) * .85, dt);
  });
}
function updateBack(dt){
  const c = M.our[M.handler];

  guardOurs(dt);

function updateLive(dt, frozen){

    if (frozen) { moveTo(e, e.tx, e.ty, ourSpeed(e) * .6, dt); return; }

function updateOpp(dt){

    M.our.forEach((e, i) => { const k = M.crash.indexOf(i); if (k < 0) { e.moving = false; return; } moveTo(e, RIM_L.x + 5, RIM_L.y + (k ? 4.5 : -4.5), ourSpeed(e), dt); tire(e, dt); e.face = -1; });

function oppShoot(h){
  const d = Math.hypot(h.x - RIM_L.x, h.y - RIM_L.y), three = isThree(h, RIM_L);

// BLOCK: one try per shot, before the release. Odds fall off with distance to the shooter;

function tryBlock(){

  const b = pbFor(M.pbox, d.p); b.blk = (b.blk || 0) + 1; M.st.them.fga++;
  const to = { x:clamp(S.h.x + rnd(4, 8), 4, 90), y:clamp(S.h.y + rnd(-5, 5), 3, 47), z:0 };
  M.ball.holder = null;
  M.ball.fl = { kind:'loose', from:{ x:S.h.x, y:S.h.y, z:8 }, to, t:0, dur:.6, peak:2, to_us:true };
  banner('BLOCKED!', `${d.p.fn[0]}. ${d.p.ln}`, 1000);
}
function updateOppMeter(){
  const S = M.oshot, t = (performance.now() - S.t0) / 1000, f = meterFill(t);
  showMeter(Math.min(f, S.target), 'o');
  if (f < S.target && t < METER_PEAK) return;
  const fill = Math.min(f, S.target), perfect = fill >= .95;
  const chance = perfect && S.d <= 28 ? 1 : shotChance(fill, S.d, S.h.p.sht, S.contested);
  $('#ometerPct').textContent = perfect ? 'PERFECT' : Math.round(fill * 100) + '%';
  M.oshot = null;
  launchShot(S.h, RIM_L, Math.random() < chance, 'them', S.three, S.d, false);
  const id = M.id;
  setTimeout(() => { if (M && M.id === id) hideMeter('o'); }, 800);
}

/* ---- ball ---- */
function launchShot(from, rim, made, side, three, d, air){
  // misses hit the front or back of the rim; airballs fall short
  const off = made ? { x:0, y:0 } : { x:(Math.random() < .5 ? -1 : 1) * rnd(.7, 1.1), y:rnd(-.5, .5) };
  const short = { x:lerp(from.x, rim.x, .8), y:lerp(from.y, rim.y, .8), z:0 };
  const to = air ? short : { x:rim.x + off.x, y:rim.y + off.y, z:RIM_Z + (made ? .3 : .5) };
  M.ball.holder = null; from.shootT = .45; M.crash = null;            // pick fresh crashers for this shot
  const T = M.st[side]; T.fga++; if (three) T.tpa++; if (made) { T.fgm++; if (three) T.tpm++; }
  if (side === 'us') { const b = pbFor(M.pbox, from.p); b.fga++; if (three) b.tpa++; if (made) { b.fgm++; if (three) b.tpm++; } }
  M.ball.fl = { kind:'shot', from:{ x:from.x + (side === 'us' ? .6 : -.6), y:from.y, z:(from.z || 0) + 7.6 }, to, t:0, dur:.55 + d * .012, peak:3 + d * .13,
    made, side, three, air, rim, shooter:from, pts:three ? 3 : 2 };
}
// A fumbled pass keeps going the way it was thrown. For a pass of length d it lands 0.25d past the
// catcher, then rolls and slows (steady friction) until it's d past him: a 40 ft pass lands 10 ft past
// and stops 40 ft past (80 ft from the passer). If it crosses a line it's out: the other team inbounds.
// Otherwise it's a loose-ball race and whoever gets to it first has it.
function fumbleLoose(rec, F, side){
  const dx = F.to.x - F.from.x, dy = F.to.y - F.from.y, len = Math.hypot(dx, dy) || 1, d = Math.max(len, 4), ux = dx / len, uy = dy / len;
  const at = t => ({ x:rec.x + ux * d * t, y:rec.y + uy * d * t });
  const inb = p => p.x >= 0 && p.x <= 94 && p.y >= 0 && p.y <= 50;
  let outT = null;
  for (let t = 0; t <= 1.0001; t += .005) if (!inb(at(t))) { outT = t; break; }
  const land = at(outT !== null && outT < .25 ? outT : .25), stop = at(outT !== null ? outT : 1);
  M.ball.holder = null;
  M.reb = { pt:{ ...land }, shotSide:null, landed:false, bt:0, loose:true, fumbler:side, who:rec.p };
  M.phase = 'reb';
  M.ball.fl = { kind:'fumble', from:{ x:rec.x, y:rec.y, z:3.5 }, to:{ ...land, z:0 }, t:0, dur:.25 + d * .004, peak:1, roll:{ from:land, to:stop, out:outT !== null }, fumbler:side };
}
function updateBall(dt){
  const B = M.ball, h = holderEnt();
  if (h && !B.fl) {
    const dribble = h.moving || M.phase === 'back';
    B.x = h.x + (h.face || 1) * 1.3; B.y = h.y + .3;
    B.z = (M.shooting && M.shooting.side === 'us' && h === M.our[M.handler]) || (M.oshot && h === M.oshot.h) ? 7.6 + (h.z || 0) : dribble ? .6 + Math.abs(Math.sin(performance.now() / 120)) * 2.4 : 3.2;
    return;
  }
  const F = B.fl;
  if (!F) {
    // a loose ball bounces lower and lower on the floor
    if (M.phase === 'reb' && M.reb && M.reb.landed) { M.reb.bt += dt; B.x = M.reb.pt.x; B.y = M.reb.pt.y; B.z = Math.abs(Math.sin(M.reb.bt * 9)) * 2.2 * Math.exp(-M.reb.bt * 2.2); }
    return;
  }
  F.t += dt;
  if (F.kind === 'pass' && F.side === 'us') { const r = M.our[F.target]; F.to.x = r.x; F.to.y = r.y; }   // lead the cutter
  if (F.kind === 'roll') {                                          // rolling on the floor, slowing at a steady rate
    const kr = Math.min(1, F.t / F.dur), e = 1 - (1 - kr) * (1 - kr);
    B.x = lerp(F.from.x, F.to.x, e); B.y = lerp(F.from.y, F.to.y, e); B.z = 0;
    if (M.reb) M.reb.pt = { x:B.x, y:B.y };
    if (kr < 1) return;
    B.fl = null;
    if (F.out) {                                                    // rolled out: the other team inbounds where it crossed
      const R = M.reb; M.reb = null; M.phase = 'pause';
      M.st[F.fumbler].to++; if (F.fumbler === 'us' && R && R.who) pbFor(M.pbox, R.who).to++;
      banner('OUT OF BOUNDS', F.fumbler === 'us' ? 'Their ball' : 'Your ball', 800);
      const id = M.id, at = { x:clamp(B.x, 2, 92), y:clamp(B.y, 1, 49) };
      setTimeout(() => { if (!M || M.id !== id) return; F.fumbler === 'us' ? startTheirs(at.x, at.y, false) : startOurs(at.x, at.y, false); }, 700);
    }
    return;                                                         // at rest in bounds: the race in updateReb goes on
  }
  const k = Math.min(1, F.t / F.dur);
  B.x = lerp(F.from.x, F.to.x, k); B.y = lerp(F.from.y, F.to.y, k);
  B.z = lerp(F.from.z, F.to.z, F.kind === 'drop' ? k * k : k) + Math.sin(Math.PI * k) * (F.peak || (F.kind === 'pass' ? 1.2 : 0));
  if (k < 1) return;
  B.fl = null;
  if (F.kind === 'pass') {
    if (F.side === 'them') {
      // their catches can slip too: same odds as ours, by the catcher's handling and whether one of ours is on him
      const rec = M.th[F.target], guarded = M.our.some(o => Math.hypot(o.x - rec.x, o.y - rec.y) < 3.5);
      if (Math.random() < fumbleChance(rec.p.hnd, !guarded)) { fumbleLoose(rec, F, 'them'); banner('THEY FUMBLE!', 'Loose ball!', 900); return; }
      give('them', F.target); M.phase = 'opp'; M.oppPlan.state = 'set'; M.oppPlan.t = .3; return;
    }
    const rec = M.our[F.target];
    if (Math.random() < fumbleChance(rec.p.hnd, F.open)) {           // it squirts off his hands and keeps going
      hideMeter(); M.shooting = null;
      fumbleLoose(rec, F, 'us'); banner('FUMBLE', 'Loose ball!', 900);
      return;
    }
    give('us', F.target); rec.spot = -1;
    if (rec.x < 47.5) { rec.tx = OUR_SPOTS[0].x; rec.ty = 25; M.phase = 'back'; }          // still in the backcourt: bring it up
    else M.phase = 'live';                                          // he keeps going where he was cutting
    return;
  }
  if (F.kind === 'fumble') {                                      // it hit the floor: now it rolls on
    if (M.reb) { M.reb.landed = true; M.reb.bt = 10; }              // bt 10: no extra bounce once it comes to rest
    B.fl = { kind:'roll', from:F.roll.from, to:F.roll.to, t:0, dur:.4 + dist(F.roll.from, F.roll.to) * .05, out:F.roll.out, fumbler:F.fumbler };
    return;
  }
  if (F.kind === 'drop') {                                        // through the net and onto the floor
    const id = M.id, side = F.side;
    setTimeout(() => { if (!M || M.id !== id) return; side === 'us' ? startTheirs(91, 25, true) : startOurs(3, 25, true); }, 450);
    return;
  }
  if (F.kind === 'bounce') { M.reb.landed = true; M.reb.bt = 0; return; }
  if (F.kind === 'loose') {                                        // the other side's ball, inbounded from where it went out
    const id = M.id, at = { x:F.to.x, y:clamp(F.to.y, 1, 49) }, ours = F.to_us;
    setTimeout(() => { if (!M || M.id !== id) return; ours ? startOurs(at.x, at.y, false) : startTheirs(at.x, at.y, false); }, 600);
    return;
  }
  // the shot reached the rim
  if (F.made) {
    M.flash = .5;
    if (F.side === 'us') { M.us += F.pts; M.box[F.shooter.p.id] = (M.box[F.shooter.p.id] || 0) + F.pts; banner(F.three ? 'THREE!' : 'BUCKET!', F.perfect ? 'PERFECT RELEASE' : `${F.shooter.p.fn[0]}. ${F.shooter.p.ln}`, 900); }
    else { M.them += F.pts; banner(`${M.opp.city} scores!`, `${M.us}-${M.them}`, 1100, true); }
    hud(); M.phase = 'pause';
    B.fl = { kind:'drop', from:{ x:F.rim.x, y:F.rim.y, z:RIM_Z }, to:{ x:F.rim.x, y:F.rim.y + .3, z:0 }, t:0, dur:.45, side:F.side };
    return;
  }
  startRebound(F);
}
function startRebound(F){
  const B = M.ball, U = userRatings(), O = teamR(M.opp);
  const back = F.rim === RIM_R ? -1 : 1;                           // off the rim, back toward the court
  const pt = F.air ? { x:B.x, y:B.y } : { x:clamp(F.rim.x + back * rnd(3, 11), 2, 92), y:clamp(F.rim.y + rnd(-10, 10), 3, 47) };
  void U; void O;
  M.reb = { pt, shotSide:F.side, landed:!!F.air, bt:0 };
  if (!F.air) B.fl = { kind:'bounce', from:{ x:B.x, y:B.y, z:B.z }, to:{ x:pt.x, y:pt.y, z:.4 }, t:0, dur:.5 + dist(B, pt) * .02, peak:3.5 };
  if (F.side === 'us') banner(F.air ? 'AIRBALL' : 'MISS', '', 800);
  M.phase = 'reb';
}
// Rebounds are a race: everyone nearby runs at the ball at their own speed and the first one there gets it.
// The shooting team is a step slower to it (the defense has inside position).
function updateReb(dt){
  const R = M.reb, pt = R.pt;
  const all = [...M.our.map((e, i) => ({ e, side:'us', i })), ...M.th.map((e, i) => ({ e, side:'them', i }))];
  for (const o of all) {
    if (dist(o.e, pt) > 26) { o.e.moving = false; continue; }
    const sp = (o.side === 'us' ? ourSpeed(o.e) : oppSpeed(o.e)) * (o.side === R.shotSide ? .88 : 1);
    moveTo(o.e, pt.x, pt.y, sp, dt);
    if (o.side === 'us') tire(o.e, dt);
  }
  if (!R.landed) return;
  let best = null, bd = 1.2;
  for (const o of all) { const d = dist(o.e, pt); if (d < bd) { bd = d; best = o; } }
  if (!best) return;
  const winner = best.e, side = best.side, offensive = side === R.shotSide;
  if (R.loose) {                                                    // a fumble: first to the ball has it
    M.ball.fl = null; give(side, best.i); M.reb = null;
    if (side !== R.fumbler) { M.st[R.fumbler].to++; if (R.fumbler === 'us' && R.who) pbFor(M.pbox, R.who).to++; }
    if (side === 'us') {
      banner(side === R.fumbler ? 'RECOVERED' : 'STOLEN!', winner.p.ln, 800);
      if (side === R.fumbler) {                                     // same possession, same shot clock
        winner.spot = -1; winner.tx = winner.x; winner.ty = winner.y;
        if (winner.x < 47.5) { winner.tx = OUR_SPOTS[0].x; winner.ty = 25; M.phase = 'back'; } else M.phase = 'live';
      } else startOurs(winner.x, winner.y, false);
    } else {
      if (side === R.fumbler) { M.phase = 'opp'; M.oppPlan = { passes:0, t:.35, state:'set', stealRoll:false }; }
      else { banner('THEY RECOVER', '', 700); startTheirs(winner.x, winner.y, false); }
    }
    return;
  }
  give(side, best.i); M.reb = null; M.st[side].reb++; if (side === 'us') pbFor(M.pbox, winner.p).reb++;
  if (side === 'us') {
    if (offensive) { M.shot = 14; M.phase = 'live'; winner.spot = -1; winner.tx = winner.x; winner.ty = winner.y; banner('OFFENSIVE REBOUND', winner.p.ln, 800); }
    else { banner('REBOUND', winner.p.ln, 700); startOurs(winner.x, winner.y, false); }
  } else {
    if (offensive) { M.phase = 'opp'; M.oppPlan = { passes:0, t:.35, state:'set', stealRoll:false }; }
    else startTheirs(winner.x, winner.y, false);
  }
}
function turnover(text, sub){
  if (!M || M.phase === 'pause') return;
  hideMeter(); M.shooting = null;
  banner(text, sub || 'Turnover', 900); M.phase = 'pause'; M.st.us.to++; pbFor(M.pbox, M.our[M.handler].p).to++;
  const id = M.id;
  setTimeout(() => { if (!M || M.id !== id) return; startTheirs(70, 25, false); }, 900);
}

/* ---- shooting ---- */
function showMeter(f, who = ''){
  $('#' + who + 'meter').hidden = false;
  const fill = $('#' + who + 'meterFill');
  fill.style.height = (f * 100) + '%';
  fill.style.background = `rgb(${Math.round(lerp(255, 68, f))},${Math.round(lerp(255, 196, f))},${Math.round(lerp(255, 93, f))})`;
}
function hideMeter(who = ''){ $('#' + who + 'meter').hidden = true; $('#' + who + 'meterPct').textContent = ''; }
function beginShot(){
  const e = M.our[M.handler];
  const d = Math.hypot(e.x - RIM_R.x, e.y - RIM_R.y);
  const dfd = M.th[M.handler];
  const contested = Math.hypot(e.x - dfd.x, e.y - dfd.y) < 3.5 && (dfd.still || 0) > .15;
  if (d < 6.5) {                                                           // layup: automatic
    const chance = shotChance(.92, Math.max(d, 3), e.p.sht, contested);
    const made = Math.random() < chance;
    M.phase = 'shot'; e.z = 2;
    launchShot(e, RIM_R, made, 'us', false, d, false);
    setTimeout(() => { if (M) e.z = 0; }, 300);
    return;
  }
  M.shooting = { t0:performance.now(), side:'us', contested, d, released:false };
  M.phase = 'shot'; e.z = 1.2;
  showMeter(0);
}
function release(auto){
  const S = M.shooting; if (!S || S.released) return;
  S.released = true;
  const t = (performance.now() - S.t0) / 1000;
  const e = M.our[M.handler];
  const fill = auto ? 0 : meterFill(t);
  const perfect = !auto && meterFill(t) >= .95;
  const three = isThree(e, RIM_R);
  let chance = perfect ? (S.d <= 28 ? 1 : shotChance(1, S.d, e.p.sht, S.contested)) : shotChance(fill, S.d, e.p.sht, S.contested);
  if (auto) chance = 0;
  const made = Math.random() < chance;
  e.p.fga = (e.p.fga || 0) + 1;
  launchShot(e, RIM_R, made, 'us', three, S.d, auto);
  M.ball.fl.perfect = perfect;
  $('#meterPct').textContent = perfect ? 'PERFECT' : Math.round(fill * 100) + '%';
  const id = M.id;
  setTimeout(() => { if (M && M.id === id) { hideMeter(); M.shooting = null; e.z = 0; } }, 700);
}

/* ---- input ---- */
function canvasPt(ev){ const r = cv.getBoundingClientRect(); return { x:(ev.clientX - r.left) / r.width * CW, y:(ev.clientY - r.top) / r.height * CH }; }
cv.addEventListener('pointerdown', ev => {
  if (!M || paused || (M.phase !== 'live' && M.phase !== 'back') || M.ball.fl || M.shooting) return;
  ev.preventDefault();
  try { cv.setPointerCapture(ev.pointerId); } catch {}
  const pt = canvasPt(ev);
  let best = -1, bd = 15;
  M.our.forEach((e, i) => { if (i === M.handler) return; const d = Math.hypot(sx(e.x) - pt.x, sy(e.y) - 12 - pt.y); if (d < bd) { bd = d; best = i; } });
  if (best >= 0) {
    const from = M.our[M.handler], to = M.our[best];
    M.phase = 'pass'; M.st.us.pass++; pbFor(M.pbox, from.p).pass++;
    M.ball.fl = { kind:'pass', from:{ x:from.x, y:from.y, z:4.5 }, to:{ x:to.x, y:to.y, z:4.5 }, t:0, dur:clamp(dist(from, to) / 42, .15, .6), side:'us', target:best, open:from.x < 47.5 || isOpen(best) };
    M.ball.holder = null;
    if (M.phase === 'pass' && from.x < 47.5) {                       // passing in the backcourt: the passer runs to an open spot
      const taken = new Set(M.our.map(o => o.spot)), free = OUR_SPOTS.map((_, k) => k).filter(k => k && !taken.has(k));
      from.spot = pick(free); from.tx = OUR_SPOTS[from.spot].x; from.ty = OUR_SPOTS[from.spot].y; from.cover = 0;
    } else { from.spot = -1; from.cover = 1; }                       // passer goes looking for a new spot
    return;                                                         // the receiver keeps running; the pass homes in on him
  }
});
const up = () => { if (M && M.shooting && !M.shooting.released) release(false); };
const sb = $('#shootBtn');
sb.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  if (M && !paused && M.phase === 'oshot') { tryBlock(); return; }
  if (!M || paused || (M.phase !== 'live' && M.phase !== 'back') || M.ball.fl || M.shooting) return;
  try { sb.setPointerCapture(ev.pointerId); } catch {} beginShot();
});
sb.addEventListener('pointerup', up);
sb.addEventListener('pointercancel', up);
sb.addEventListener('contextmenu', ev => ev.preventDefault());
$('#pauseBtn').addEventListener('click', () => { if (!M) return; paused = true; speedSheet(true); });

/* ---- draw ---- */
function draw(){
  if (!M) return;
  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.imageSmoothingEnabled = false;
  const B = M.ball;
  const target = clamp(X0 + B.x * PXF - CW / 2, 0, WORLD_W - CW);
  cam = lerp(cam, target, .12);
  ctx.drawImage(courtCv, Math.round(cam), 0, CW, CH, 0, 0, CW, CH);
  cam = Math.round(cam * 100) / 100;
  const t = M.t;
  const openMark = M.phase === 'live' || M.phase === 'back';        // full-court offense: open markers from the moment we have it
  const ents = [
    ...M.our.map((e, i) => ({ y:e.y, f:() => drawPlayer(e, M.uni.us, i === M.handler && (M.phase === 'live' || M.phase === 'back') ? '#ffd23f' : openMark && i !== M.handler && isOpen(i) ? '#44ff6a' : null) })),
    ...M.th.map(e => ({ y:e.y, f:() => drawPlayer(e, M.uni.them, null) })),
    { y:25.01, f:() => { drawHoop(0, M.flash > 0 && B.x < 47); drawHoop(1, M.flash > 0 && B.x > 47); } },
    { y:-2, f:() => { drawBench('us'); drawBench('them'); } },
  ].sort((a, b) => a.y - b.y);
  ents.forEach(x => x.f());
  drawBall(B.x, B.y, B.z);
}
function loop(now){
  const dt = clamp((now - lastT) / 1000, 0, .05); lastT = now;
  update(dt); draw();
  if (M) raf = requestAnimationFrame(loop);
}

/* ============================ boot ============================ */
try { const raw = localStorage.getItem(CACHE); if (raw) G = migrate(JSON.parse(raw)); } catch {}
render();
(async () => {
  const use = window.claude?.use; if (!use) return;
  DB = await use('db').catch(() => null); if (!DB) return;
  try {
    const snap = await DB.doc('saves/main').get();
    if (snap.exists) { const r = JSON.parse(snap.data().json); if (r && r.v && r.v < 2) { DB.doc('saves/legacy').set(snap.data()).catch(() => {}); } if (r && r.v >= 2) { G = migrate(r); try { localStorage.setItem(CACHE, snap.data().json); } catch {} if (!M) { screen = 'hub'; render(); } } }
    else if (G) save();
  } catch (e) { console.warn(e); }
})();
})();
</script>
